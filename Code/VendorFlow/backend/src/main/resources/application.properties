server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/vendorflow
spring.datasource.username=postgres
spring.datasource.password=postgres12
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Seed data runs after schema creation
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT
jwt.secret=VendorFlow2024SecretKeyForJWTTokenGenerationAndValidationMustBe256Bits
jwt.expiration=86400000
